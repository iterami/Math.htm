<!doctype html>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>Math.htm</title>
<link href=../common/css/core.css rel=stylesheet>

<textarea class=medium id=calculator></textarea>
<div class=big id=result></div>
<div class=medium id=result_formatted></div>
<button id=calculate type=button>Calculate</button><button id=clear type=button>Clear</button><button id=euler type=button>e</button><button id=pi type=button>π</button>
<table>
  <tr>
    <td>Principal
    <td><input id=principal step=any type=number>
  <tr>
    <td>Interest
    <td><input id=interest step=any type=number>
  <tr>
    <td>Compound
    <td><input id=compound type=checkbox>
  <tr>
    <td>Time
    <td><input id=time step=any type=number>
  <tr>
    <td>Minimum Decimals
    <td><input id=decimals min=0 step=1 type=number>
  <tr>
    <td><button id=calculate-interest type=button>Calculate Interest</button>
    <td id=result_interest>
</table>
<table>
  <tr class=header>
    <td>Type
    <td>Width
    <td>Height
  <tr>
    <td>Aspect Ratio
    <td><input id=ratio_width step=any type=number>
    <td><input id=ratio_height step=any type=number>
  <tr>
    <td>Resolution
    <td><input id=width step=any type=number>
    <td><input id=height step=any type=number>
</table>
<table>
  <tr class=header>
    <td>Percentages
    <td><button id=calculate-percent type=button>Calculate Percent</button>
  <tr>
    <td>Step End
    <td><input id=step_end step=any type=number>
  <tr>
    <td>Step Interval
    <td><input id=step_interval step=any type=number>
  <tr>
    <td>Step Limit
    <td><input id=step_limit step=1 type=number>
  <tr>
    <td>Step Start
    <td><input id=step_start step=any type=number>
</table>
<table>
  <thead>
    <tr class=header>
      <td>Step
      <td>Total
      <td>Step%
      <td>Total%
  <tbody id=result_percent>
</table>

<script src=../common/js/core.js></script>
<script src=repo.js></script>
